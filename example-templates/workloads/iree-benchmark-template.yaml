apiVersion: batch/v1
kind: Job
metadata:
  name: ericfeng-iree-benchmark-test-job

spec:
  template:
    spec:
      volumes:
      - name: model-weights
        persistentVolumeClaim:
          claimName: eric-pvc
      containers:
      - name: iree-benchmark-suite
        image: efric/iree-benchmark-test
        command: ["/bin/bash", "-c"]
        volumeMounts:
        - name: model-weights
          mountPath: /data/shark
        args:
          - |
            set -eux
            readonly IREE_DIR="/iree"
            readonly BENCHMARK_DIR="/iree-model-benchmark"
            readonly BUILD_DIR="/iree-build"
      
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"
      
            readonly COMMON_FLAGS="-fno-omit-frame-pointer"
            readonly CXX="clang++"
            readonly CC="clang"
      
            cmake "$IREE_DIR" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DPython3_EXECUTABLE="$(which python)" \
                  -DIREE_BUILD_PYTHON_BINDINGS=1 \
                  -DIREE_HAL_DRIVER_HIP=1 \
                  -DIREE_TARGET_BACKEND_ROCM=1 \
                  -DIREE_HIP_TEST_TARGET_CHIP=gfx942 \
                  -DIREE_ENABLE_ASSERTIONS=1 \
                  -DIREE_BUILD_TRACY=0 \
                  -DIREE_ENABLE_COMPILER_TRACING=0 \
                  -DIREE_ENABLE_RUNTIME_TRACING=1 \
                  -DIREE_ENABLE_LLD=1 \
                  -DIREE_ENABLE_SPLIT_DWARF=1 \
                  -DIREE_ENABLE_THIN_ARCHIVES=1 \
                  -DLLVM_INSTALL_UTILS=1 \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_C_COMPILER="$CC" \
                  -DCMAKE_CXX_FLAGS="${COMMON_FLAGS}" -DCMAKE_C_FLAGS="${COMMON_FLAGS}" \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=1 \
                  -DCMAKE_INSTALL_PREFIX=run
      
            echo "[INFO] IREE CMake successfully configured build system in $BUILD_DIR."
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            echo "[INFO] IREE successfully built in $BUILD_DIR."

            if [ ! -f /data/shark/punet_fp8_weights.irpa ]; then
              echo "[INFO] Model weights not found. Downloading IRPA file..."
              curl -L -o /data/shark/punet_fp8_weights.irpa \
                https://sharkpublic.blob.core.windows.net/sharkpublic/sdxl-scripts-weights/punet_fp8_weights.irpa
              echo "42df7496dc012548e5fc1a198cb1161d  /data/shark/punet_fp8_weights.irpa" | md5sum -c || {
                echo "[ERROR] IRPA checksum verification failed" >&2
                exit 1
              }
            fi

            #Usage: PATH=/path/to/iree/build/tools:$PATH ./compile-unet.sh <target-chip> [extra flags]
            PATH="$BUILD_DIR"/tools:$PATH "$BENCHMARK_DIR"/sdxl/fp8-model/compile-punet.sh gfx942 none 4
            #Usage: PATH=/path/to/iree/build/tools:$PATH ./benchmark-unet.sh <hip-device-id> <batch-size> [<ipra-path-prefix>]

            echo "[INFO] Running IREE model benchmarks"
            PATH="$BUILD_DIR"/tools:$PATH "$BENCHMARK_DIR"/sdxl/fp8-model/benchmark-unet.sh 0 4
            echo "[INFO] sdxl fp8 modle benchmark completed."
        resources:
          limits:
            amd.com/gpu: 1
      restartPolicy: Never
  backoffLimit: 0

