apiVersion: batch/v1
kind: Job
metadata:
  name: iree-benchmark-job
spec:
  template:
    spec:
      volumes:
      - name: iree-benchmark-vol
        persistentVolumeClaim:
          claimName: eric-pvc
      containers:
      - name: iree-benchmark-suite
        image: efric/iree-benchmark-test #ghcr.io/efric/iree-benchmark-test:latest
        command: ["/bin/bash", "-c"]
        volumeMounts:
        - name: iree-benchmark-vol
          mountPath: /data/shark # for IRPA weights
        - name: iree-benchmark-vol
          mountPath: /iree-cache # for build cache & signatures
        env:
        - name: IREE_CMAKE_FLAGS
          value: >
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
            -DIREE_BUILD_PYTHON_BINDINGS=1
            -DIREE_HAL_DRIVER_HIP=1
            -DIREE_TARGET_BACKEND_ROCM=1
            -DIREE_HIP_TEST_TARGET_CHIP=gfx942
            -DIREE_ENABLE_ASSERTIONS=1
            -DIREE_BUILD_TRACY=0
            -DIREE_ENABLE_COMPILER_TRACING=0
            -DIREE_ENABLE_RUNTIME_TRACING=1
            -DIREE_ENABLE_LLD=1
            -DIREE_ENABLE_SPLIT_DWARF=1
            -DIREE_ENABLE_THIN_ARCHIVES=1
            -DLLVM_INSTALL_UTILS=1
            -DCMAKE_EXPORT_COMPILE_COMMANDS=1
        - name: IREE_GIT_BRANCH
          value: "main" # switch out for desired branch
        - name: BENCHMARK_OUT_FORMAT
          value: "json"
        - name: BENCHMARK_DIR
          value: "/iree-model-benchmark"
        - name: BENCHMARK_PATH
          value: "sdxl/fp16-model" # relative path under BENCHMARK_DIR
        - name: COMPILE_SCRIPT
          value: "compile-unet.sh"
        - name: BENCHMARK_SCRIPT
          value: "benchmark-unet.sh"
        - name: IRPA_URL
          value: "https://sharkpublic.blob.core.windows.net/sharkpublic/sdxl-scripts-weights/scheduled_unet_fp16.irpa" #"https://sharkpublic.blob.core.windows.net/sharkpublic/sdxl-scripts-weights/punet_fp8_weights.irpa"
        - name: RESULT_PREFIX
          value: "results"
        - name: HIP_TARGET_CHIP
          value: "gfx942"
        - name: TUNING_CHIP_CONFIG_MODE
          value: "none"
        - name: BATCH_SIZE
          value: "4"
        - name: HIP_DEVICE_ID
          value: "0"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: oci-s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: oci-s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: oci-s3-credentials
              key: AWS_SESSION_TOKEN
        args:
          - |
            set -eu
            readonly IREE_DIR="/iree"
            readonly CACHE_ROOT="/iree-cache"

            cd "$BENCHMARK_DIR"
            git pull origin main

            cd "$IREE_DIR"
            git fetch origin --tags
            git checkout "$IREE_GIT_BRANCH"
            git pull --recurse-submodules origin "$IREE_GIT_BRANCH"

            readonly HEAD_COMMIT=$(git rev-parse HEAD)
            readonly CONFIG_HASH=$(echo -n "$HEAD_COMMIT|${IREE_CMAKE_FLAGS//$'\n'/ }" | md5sum | awk '{print $1}')

            readonly BUILD_DIR="${CACHE_ROOT}/build-${CONFIG_HASH}"
            readonly INSTALL_DIR="${CACHE_ROOT}/install-${CONFIG_HASH}"
            readonly SIG_FILE="${CACHE_ROOT}/.signature-${CONFIG_HASH}"
            readonly TMP_SIG="/tmp/current.signature"

            mkdir -p "$CACHE_ROOT"
            echo "$HEAD_COMMIT" > "$TMP_SIG"

            readonly COMMON_FLAGS="-fno-omit-frame-pointer"
            readonly CXX="clang++"
            readonly CC="clang"

            # Rebuild if needed
            if ! cmp -s "$TMP_SIG" "$SIG_FILE"; then
              echo "[INFO] Rebuilding IREE for commit $HEAD_COMMIT"
              rm -rf "$BUILD_DIR" "$INSTALL_DIR"
              mkdir -p "$BUILD_DIR"
              cmake "$IREE_DIR" -B "$BUILD_DIR" -GNinja \
                $IREE_CMAKE_FLAGS \
                -DPython3_EXECUTABLE="$(which python)" \
                -DCMAKE_CXX_COMPILER="$CXX" \
                -DCMAKE_C_COMPILER="$CC" \
                -DCMAKE_CXX_FLAGS="${COMMON_FLAGS}" \
                -DCMAKE_C_FLAGS="${COMMON_FLAGS}" \
                -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR"
              cmake --build "$BUILD_DIR" -j"$(nproc)"
              cp "$TMP_SIG" "$SIG_FILE"
            else
              echo "[INFO] Reusing cached build at $INSTALL_DIR"
            fi

            # Download IRPA model if missing
            IRPA_DEST="/data/shark/$(basename "$IRPA_URL")"
            if [ ! -f "$IRPA_DEST" ]; then
              echo "[INFO] Downloading IRPA weights from $IRPA_URL"
              curl -L -o "$IRPA_DEST" "$IRPA_URL"
            fi

            BENCH_NAME="$(basename "$BENCHMARK_PATH")"
            RESULT_FILE="$BENCHMARK_DIR/$BENCHMARK_PATH/${RESULT_PREFIX}-${BENCH_NAME}-${CONFIG_HASH}.json"

            mkdir -p "$IREE_DIR"/tmp/
            echo "[INFO] Running compile and benchmark for $BENCH_NAME"
            PATH="$BUILD_DIR/tools:$PATH" "$BENCHMARK_DIR/$BENCHMARK_PATH/$COMPILE_SCRIPT" "$HIP_TARGET_CHIP" #"$TUNING_CHIP_CONFIG_MODE" "$BATCH_SIZE"
            PATH="$BUILD_DIR/tools:$PATH" "$BENCHMARK_DIR/$BENCHMARK_PATH/$BENCHMARK_SCRIPT" "$HIP_DEVICE_ID" > "$RESULT_FILE"

            echo "[INFO] Benchmark completed. Uploading results to S3"
            aws s3 cp "$RESULT_FILE" "s3://eric-shark-test/$(basename "$RESULT_FILE")"
            echo "[COMPLETED] Download results: aws s3 cp s3://eric-shark-test/$(basename "$RESULT_FILE") /local/path/to/results/"
        resources:
          limits:
            amd.com/gpu: 1
      restartPolicy: Never
  backoffLimit: 0
